packages:
  - "packages/*"

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@moon7/config-eslint@0.1.3'
  - '@moon7/config-vite@0.1.0'

registries:
  default: https://registry.npmjs.org/
  "@moon7": https://registry.npmjs.org/

versioning:
  changelog:
    storage: repository
  ignore:
    - "@moon7/internal-*"
